name: Deploy to OVH VPS

on:
  workflow_run:
    workflows: ["CI"]
    branches:
      - main
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY_PIKAICHU_USER }}

      - name: Add remote host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Copy deploy script
        run: scp .github/workflows/deploy.sh ${{ secrets.SSH_PIKAICHU_USER }}@${{ secrets.SSH_HOST }}:/var/www/pikaichu-symfony/deploy.sh

      - name: Deploy on server
        run: |
          COMMIT_HASH=$(git rev-parse HEAD)
          ssh ${{ secrets.SSH_PIKAICHU_USER }}@${{ secrets.SSH_HOST }} \
            "/var/www/pikaichu-symfony/deploy.sh $COMMIT_HASH"
