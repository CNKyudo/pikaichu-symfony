services:
    # `_defaults` ne se propage pas d'un fichier à l'autre : il faut le redéclarer
    # ici, sinon les services ci-dessous perdent leur autowiring.
    _defaults:
        autowire: true
        autoconfigure: true
        public: true

    # Les services de domaine ne sont pas encore tous injectés dans un contrôleur ;
    # sans définition publique le conteneur les inline et les tests ne peuvent plus
    # les récupérer via getContainer().
    App\Service\TaikaiStateMachine: ~
    App\Service\MarkingService: ~
    App\Service\DrawService: ~
    App\Service\MatchService: ~
    App\Service\LeaderboardService: ~
    App\Service\ScoreInitializer: ~
    App\Service\Ranker: ~
