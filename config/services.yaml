parameters:
    app.default_locale: 'fr'
    app.supported_locales: ['fr', 'en']

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/DTO/'
            - '../src/Exception/'
            - '../src/Kernel.php'

    # Chargeur Twig pour les templates d’interface (classique vs beta).
    App\Twig\UiTemplateLoader:
        arguments:
            $inner: '@twig.loader.native_filesystem'
        tags:
            - { name: twig.loader, priority: 100 }


    # Piste d'audit (voir MIGRATION.md) : équivalent du gem `audited` côté Rails.
    # `LoggableListener` implémente `EventSubscriber`, mais le bridge Doctrine de
    # Symfony n'étend plus le tag `doctrine.event_subscriber` en un tag par
    # événement — il faut lister explicitement chacun des événements renvoyés par
    # `getSubscribedEvents()` (onFlush, loadClassMetadata, postPersist).
    Gedmo\Loggable\LoggableListener:
        tags:
            - { name: doctrine.event_listener, event: onFlush, connection: default }
            - { name: doctrine.event_listener, event: loadClassMetadata, connection: default }
            - { name: doctrine.event_listener, event: postPersist, connection: default }
        calls:
            - setActorProvider: ['@App\Security\LoggableActorProvider']
