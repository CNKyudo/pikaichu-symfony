symfonycasts_reset_password:
    request_password_repository: App\Repository\ResetPasswordRequestRepository
    # Aligné sur `User#generate_password_reset_token` côté Rails (`expires_in: 15.minutes`).
    lifetime: 900
    # Rails limite les demandes à 5 par IP sur 10 minutes (`rate_limit`). Le bundle
    # limite plutôt le renvoi par utilisateur ; 5 minutes entre deux demandes suffit
    # à décourager l'abus tout en restant tolérant à une erreur de frappe.
    throttle_limit: 300
