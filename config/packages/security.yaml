security:
    password_hashers:
        # Rails `has_secure_password` stocke des empreintes bcrypt : en conservant
        # bcrypt ici, les mots de passe existants restent valides après migration.
        App\Entity\User:
            algorithm: bcrypt
            cost: 12

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: emailAddress

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                username_parameter: email_address
                password_parameter: password
                enable_csrf: true
                default_target_path: app_taikai_index
            logout:
                path: app_logout
                target: app_login
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800

    access_control:
        # Pages publiques : connexion, inscription, résultats projetés en salle.
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/register, roles: PUBLIC_ACCESS }
        - { path: ^/scoreboard, roles: PUBLIC_ACCESS }
        - { path: ^/taikais/\d+/leaderboard/public, roles: PUBLIC_ACCESS }
        - { path: ^/, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # Empreintes volontairement bon marché pour accélérer les tests.
            App\Entity\User:
                algorithm: bcrypt
                cost: 4
