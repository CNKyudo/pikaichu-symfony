framework:
    secret: '%env(APP_SECRET)%'
    session:
        handler_id: null
        cookie_secure: auto
        cookie_samesite: lax
    php_errors:
        log: true
    default_locale: '%app.default_locale%'
    translator:
        default_path: '%kernel.project_dir%/translations'
        fallbacks: ['fr']

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
